<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Togetherland</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f6f3;
      color: #202938;
      font-family: "Trebuchet MS", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    main {
      padding: 55px 20px;
      max-width: 520px;
      width: 100%;
    }

    .heart {
      font-size: 30px;
      color: #b33a4b;
      margin-bottom: 18px;
      line-height: 1;
    }

    h1 {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      font-size: 52px;
      font-weight: normal;
      letter-spacing: -1.5px;
      margin: 0 0 10px;
      color: #202938;
    }

    .subtitle {
      color: #69717d;
      font-size: 16px;
      margin: 0 0 46px;
      letter-spacing: 0.4px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e3e1dd;
      border-radius: 18px;
      padding: 30px 28px;
      margin: 18px 0;
      box-shadow: 0 5px 20px rgba(32, 41, 56, 0.055);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 28px rgba(32, 41, 56, 0.09);
    }

    .card h2 {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      font-weight: normal;
      font-size: 25px;
      letter-spacing: -0.3px;
      margin: 0 0 10px;
      color: #202938;
    }

    .card p {
      font-size: 14px;
      line-height: 1.6;
      color: #69717d;
      margin: 0;
      letter-spacing: 0.1px;
    }
  </style>
</head>

<body>

  <main>

    <div class="heart">♥</div>

    <h1>Togetherland</h1>

    <p class="subtitle">A little place for us.</p>

    <div class="card">
      <h2>Our Journals</h2>
      <p>A place for our thoughts, one page at a time.</p>
    </div>

    <div class="card">
      <h2>Weekly Check-In</h2>
      <p>A little time each week to reconnect.</p>
    </div>

  </main>

</body>
</html>
