<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Togetherland</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f6f3;
      color: #202938;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    main {
      padding: 50px 20px;
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 46px;
      font-weight: normal;
      letter-spacing: -1px;
      margin: 0 0 8px;
      color: #202938;
    }

    .subtitle {
      color: #69717d;
      font-size: 16px;
      margin: 0 0 42px;
      letter-spacing: 0.2px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e3e1dd;
      border-radius: 16px;
      padding: 28px 25px;
      margin: 18px 0;
      box-shadow: 0 4px 18px rgba(32, 41, 56, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 24px rgba(32, 41, 56, 0.08);
    }

    .card h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 23px;
      margin: 0 0 9px;
      color: #202938;
    }

    .card p {
      font-size: 14px;
      line-height: 1.5;
      color: #69717d;
      margin: 0;
    }

    .accent {
      color: #b33a4b;
    }

    .tiny-heart {
      font-size: 15px;
      color: #b33a4b;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>

  <main>

    <div class="tiny-heart">♥</div>

    <h1>Togetherland</h1>

    <p class="subtitle">A little place for us.</p>

    <div class="card">
      <h2>Our Journals</h2>
      <p>A place for our thoughts, one page at a time.</p>
    </div>

    <div class="card">
      <h2>Weekly Check-In</h2>
      <p>A little time each week to reconnect.</p>
    </div>

  </main>

</body>
</html>
