<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Togetherland</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffeaef;
      color: #302b54;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    main {
      padding: 40px 20px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #806d82;
      font-style: italic;
      margin-bottom: 40px;
    }
    .card {
      background: #fffdfd;
      border: 1px solid #f4cbd8;
      border-radius: 12px;
      padding: 25px;
      margin: 18px 0;
    }
    .card h2 {
      font-weight: normal;
      font-size: 23px;
      margin: 0 0 8px;
    }
    .card p {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #806d82;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Togetherland</h1>
    <p class="subtitle">A little place for us.</p>

    <div class="card">
      <h2>Our Journals</h2>
      <p>A place for our thoughts, one page at a time.</p>
    </div>

    <div class="card">
      <h2>Weekly Check-In</h2>
      <p>A little time each week to reconnect.</p>
    </div>
  </main>
</body>
</html>
